apiVersion: v1
kind: Namespace
metadata:
  name: wealthfolio
---
apiVersion: v1
kind: Secret
metadata:
  name: wealthfolio-secret
  namespace: wealthfolio
type: Opaque
stringData:
  WF_SECRET_KEY: "2GWkERCIxqJhH7vX4bMXLwVDO1yVmVH2NTepKOdV7dQ="
  WF_AUTH_PASSWORD_HASH: "$argon2id$v=19$m=4096,t=3,p=1$NTRjNWUzMTA0ZmUzOGQ0Yg$a1yWBEZDHwdA+Z1i21XWR61C3yZtZvCcjtCeehyspk8"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wealthfolio-data
  namespace: wealthfolio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealthfolio
  namespace: wealthfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wealthfolio
  template:
    metadata:
      labels:
        app: wealthfolio
    spec:
      containers:
      - name: wealthfolio
        image: ghcr.io/wealthfolio/wealthfolio:latest
        ports:
        - containerPort: 8088
          name: http
        env:
        - name: WF_LISTEN_ADDR
          value: "0.0.0.0:8088"
        - name: WF_DB_PATH
          value: "/data/wealthfolio.db"
        - name: WF_CORS_ALLOW_ORIGINS
          value: "https://wealthfolio.lan"
        - name: WF_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: wealthfolio-secret
              key: WF_SECRET_KEY
        - name: WF_AUTH_PASSWORD_HASH
          valueFrom:
            secretKeyRef:
              name: wealthfolio-secret
              key: WF_AUTH_PASSWORD_HASH
        volumeMounts:
        - name: wealthfolio-data
          mountPath: /data
      volumes:
      - name: wealthfolio-data
        persistentVolumeClaim:
          claimName: wealthfolio-data
---
apiVersion: v1
kind: Service
metadata:
  name: wealthfolio
  namespace: wealthfolio
spec:
  selector:
    app: wealthfolio
  ports:
  - name: http
    port: 8088
    targetPort: 8088
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wealthfolio-http
  namespace: wealthfolio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-https@kubernetescrd
spec:
  rules:
  - host: wealthfolio.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wealthfolio
            port:
              number: 8088
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wealthfolio-https
  namespace: wealthfolio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
  - host: wealthfolio.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wealthfolio
            port:
              number: 8088
  tls:
  - hosts:
    - wealthfolio.lan
    secretName: wealthfolio-tls
